name: "Unified Infrastructure Request"
description: "Self-service request form covering all cloud-governance modules with collapsible guidance and plain-text inputs."
title: "[Infra Request]: "
labels: ["provisioning", "stack"]

body:
  - type: markdown
    attributes:
      value: |
        # 🏛️ Unified Cloud Infrastructure Provisioning Form
        This form allows you to request infrastructure provisioned directly by the **`cloud-governance`** Terraform modules.
        
        ### Instructions:
        1. Select the target **Environment** and **Region**.
        2. Check off the modules you wish to provision under **Module Selection**.
        3. Expand the **`<details>`** block for any module to view its exact parameters, allowed values, and defaults from `cloud-governance`.
        4. Enter the required parameters into the corresponding text area in simple `Field: Value` format (no raw YAML syntax required).
        5. Complete the mandatory **Governance & Metadata** section at the bottom.

  # ============================================================================
  # 1. ENVIRONMENT & REGION
  # ============================================================================
  - type: dropdown
    id: environment
    attributes:
      label: "Target Environment"
      description: "Deployment environment"
      options:
        - dev
        - qa
        - prod
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "AWS Region"
      description: "Primary deployment region"
      options:
        - ap-south-1
        - us-east-1
    validations:
      required: true

  # ============================================================================
  # 2. MODULE CHECKLIST
  # ============================================================================
  - type: checkboxes
    id: module_checklist
    attributes:
      label: "Module Selection"
      description: "Select all modules you wish to provision in this ticket. Only fill the text areas for selected modules."
      options:
        - label: "Storage & CDN: S3 Bucket, CloudFront CDN"
        - label: "Compute & Scheduling: EC2 Instance, SSH Key Pair, EventBridge Scheduler"
        - label: "Databases: RDS Instance, RDS Parameter Group"
        - label: "Networking: VPC, Public/Private Subnets, EIP, VPC Flow Logs, Route53"
        - label: "Load Balancing: Application/Network Load Balancer (ALB/NLB), Target Group"
        - label: "Containers & CI/CD: ECR Repository, CodeBuild, CodeDeploy, CodePipeline, CodeStar"
        - label: "Security & IAM: Security Group, KMS Key, Secrets Manager, IAM Role/Policy, Elevated Access"
        - label: "Observability & Notifications: CloudWatch Logs/Alerts, AWS Budget, Access Analyzer, SES"

  # ============================================================================
  # 3. STORAGE & CONTENT DELIVERY (CDN)
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 📦 Storage & Content Delivery

        <details>
        <summary><b>ℹ️ S3 Bucket Specification (modules/storage/s3)</b></summary>

        * **Bucket Name** *(required)*: Unique name. Lowercase alphanumeric and hyphens (3–63 chars).
        * **Versioning** *(default: Enabled)*: `Enabled` | `Disabled`
        * **Encryption** *(default: AES256)*: `AES256` | `AWS-KMS`
        * **Object Ownership** *(default: BucketOwnerEnforced)*: `BucketOwnerEnforced`
        * **Noncurrent Expiration Days** *(default: 30)*: Days to keep old versions before deletion.
        * **Abort Incomplete Multipart Upload Days** *(default: 7)*: Days before cleanup.
        </details>

  - type: textarea
    id: s3_input
    attributes:
      label: "S3 Bucket Configuration"
      description: "Specify parameters for S3 bucket(s). Leave blank if not requesting S3."
      placeholder: |
        Bucket Name: assets-storage
        Versioning: Enabled
        Encryption: AES256
        Noncurrent Expiration Days: 30
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ CloudFront CDN Specification (modules/cdn)</b></summary>

        * **Origin Domain Name** *(required)*: S3 bucket regional domain or ALB DNS name.
        * **Origin ID** *(required)*: Unique identifier for the origin.
        * **Price Class** *(default: PriceClass_100)*: `PriceClass_100` (US/EU) | `PriceClass_200` | `PriceClass_All`
        * **Default Root Object** *(default: index.html)*: Entry file.
        * **Viewer Protocol Policy** *(default: redirect-to-https)*: `redirect-to-https` | `https-only`
        * **Aliases** *(optional)*: Custom CNAME domains (comma-separated).
        * **ACM Certificate ARN** *(optional)*: Required if aliases are provided (must be in us-east-1).
        </details>

  - type: textarea
    id: cdn_input
    attributes:
      label: "CloudFront CDN Configuration"
      description: "Specify parameters for CloudFront distribution. Leave blank if not requesting CDN."
      placeholder: |
        Origin Domain Name: payment-assets.s3.ap-south-1.amazonaws.com
        Origin ID: S3-payment-assets
        Price Class: PriceClass_100
        Default Root Object: index.html
    validations:
      required: false

  # ============================================================================
  # 4. COMPUTE & SCHEDULING
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 💻 Compute & Scheduling

        <details>
        <summary><b>ℹ️ EC2 Compute Specification (modules/compute/ec2)</b></summary>

        * **Instance Name** *(required)*: Identifier for the EC2 instance.
        * **Instance Type** *(required)*: Approved types: `t3.micro`, `t3.small`, `t3.medium`, `t3.large`, `m5.large`.
        * **AMI Image** *(required)*: `amazon-linux-2` | `ubuntu-22.04` | `redhat-9` | custom AMI ID.
        * **Root Volume Size** *(required)*: EBS size in GB (min: 20, max: 200).
        * **Subnet ID / Type** *(required)*: Subnet ID or `public` | `private`.
        * **Ports to Open** *(optional)*: Comma-separated inbound ports (e.g., `80, 443`).
        * **Minimal Access Intent** *(optional)*: E.g., `S3: assets-storage (read-write), RDS: order-db (connect)`.
        </details>

  - type: textarea
    id: ec2_input
    attributes:
      label: "EC2 Instance Configuration"
      description: "Specify parameters for EC2 instance(s). Leave blank if not requesting EC2."
      placeholder: |
        Instance Name: web-api-server
        Instance Type: t3.micro
        AMI Image: amazon-linux-2
        Root Volume Size: 30
        Subnet Type: private
        Ports to Open: 80, 443
        Access Permissions: S3: assets-storage (read-write)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ SSH Key Pair Specification (modules/ssh-key-pair)</b></summary>

        * **Key Name** *(required)*: Unique name for the SSH key pair.
        * **Public Key** *(required)*: OpenSSH public key string (`ssh-rsa ...` or `ssh-ed25519 ...`).
        </details>

  - type: textarea
    id: ssh_key_input
    attributes:
      label: "SSH Key Pair Configuration"
      description: "Specify key name and public key. Leave blank if not requesting SSH key."
      placeholder: |
        Key Name: devops-bastion-key
        Public Key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG... devops@nagarro.com
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ EventBridge Scheduler Specification (modules/eventbridge_scheduler)</b></summary>

        * **Schedule Name** *(required)*: Name of the automated schedule.
        * **Schedule Expression** *(required)*: Cron or rate syntax (e.g. `cron(0 18 ? * MON-FRI *)` or `rate(1 day)`).
        * **Target ARN** *(required)*: ARN of Lambda, ECS task, or SSM automation to invoke.
        * **Flexible Time Window** *(default: OFF)*: `OFF` | `15 minutes` | `1 hour`
        </details>

  - type: textarea
    id: scheduler_input
    attributes:
      label: "EventBridge Scheduler Configuration"
      description: "Specify schedule expression and target ARN. Leave blank if not requesting Scheduler."
      placeholder: |
        Schedule Name: nightly-instance-stop
        Schedule Expression: cron(0 20 ? * MON-FRI *)
        Target ARN: arn:aws:lambda:ap-south-1:123456789012:function:StopDevInstances
    validations:
      required: false

  # ============================================================================
  # 5. DATABASES
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🗄️ Databases

        <details>
        <summary><b>ℹ️ RDS Instance Specification (modules/rds/instance)</b></summary>

        * **Identifier** *(required)*: Unique database name (letters, numbers, hyphens).
        * **Engine** *(required)*: `postgres` | `mysql` | `mariadb`
        * **Engine Version** *(optional)*: E.g., `15.4` (PostgreSQL) or `8.0` (MySQL).
        * **Instance Class** *(required)*: `db.t4g.micro` | `db.t4g.small` | `db.t4g.medium` | `db.r6g.large`
        * **Allocated Storage** *(required)*: In GB (min: 20, max: 500).
        * **Multi-AZ** *(default: false)*: `true` | `false`
        * **Database Name** *(optional)*: Initial DB name to create inside the instance.
        * **Publicly Accessible** *(default: false)*: Enforced to `false` by security governance.
        </details>

  - type: textarea
    id: rds_instance_input
    attributes:
      label: "RDS Instance Configuration"
      description: "Specify RDS instance parameters. Leave blank if not requesting RDS."
      placeholder: |
        Identifier: orders-db
        Engine: postgres
        Engine Version: 15.4
        Instance Class: db.t4g.micro
        Allocated Storage: 20
        Multi-AZ: false
        Database Name: orders_db
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ RDS Parameter Group Specification (modules/rds/parameter_group)</b></summary>

        * **Group Name** *(required)*: Parameter group name.
        * **Family** *(required)*: Database engine family (e.g. `postgres15`, `mysql8.0`).
        * **Custom Parameters** *(optional)*: Key-value parameters (e.g. `shared_preload_libraries: pg_stat_statements`).
        </details>

  - type: textarea
    id: rds_parameter_group_input
    attributes:
      label: "RDS Parameter Group Configuration"
      description: "Specify DB parameter group family and overrides. Leave blank if not requesting."
      placeholder: |
        Group Name: custom-pg15-params
        Family: postgres15
        Parameters: max_connections=150, log_statement=ddl
    validations:
      required: false

  # ============================================================================
  # 6. NETWORKING & DNS
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🌐 Networking & DNS

        <details>
        <summary><b>ℹ️ VPC & Subnet Specification (modules/vpc, modules/subnets)</b></summary>

        * **VPC Name** *(required)*: Name tag for the VPC.
        * **VPC CIDR Block** *(required)*: E.g., `10.0.0.0/16`.
        * **Public Subnet CIDRs** *(optional)*: Comma-separated (e.g., `10.0.1.0/24, 10.0.2.0/24`).
        * **Private Subnet CIDRs** *(optional)*: Comma-separated (e.g., `10.0.10.0/24, 10.0.20.0/24`).
        * **Availability Zones** *(optional)*: Comma-separated (e.g., `ap-south-1a, ap-south-1b`).
        </details>

  - type: textarea
    id: vpc_subnets_input
    attributes:
      label: "VPC & Subnets Configuration"
      description: "Specify VPC CIDR and Subnet allocations. Leave blank if using default VPC."
      placeholder: |
        VPC Name: core-network-vpc
        VPC CIDR: 10.100.0.0/16
        Public Subnet CIDRs: 10.100.1.0/24, 10.100.2.0/24
        Private Subnet CIDRs: 10.100.11.0/24, 10.100.12.0/24
        Availability Zones: ap-south-1a, ap-south-1b
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ Elastic IP (EIP) & VPC Flow Logs (modules/eip, modules/vpc-flow-logs)</b></summary>

        * **EIP Name** *(optional)*: Name of Elastic IP for NAT Gateway or Bastion.
        * **VPC Flow Logs** *(optional)*: `Traffic Type: ALL | ACCEPT | REJECT`, `Retention Days: 14 | 30 | 90`.
        </details>

  - type: textarea
    id: eip_flowlogs_input
    attributes:
      label: "EIP & VPC Flow Logs Configuration"
      description: "Specify EIP or Flow Log requests. Leave blank if not required."
      placeholder: |
        EIP Name: nat-gw-ip
        VPC Flow Logs Traffic Type: ALL
        VPC Flow Logs Retention Days: 30
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ Route 53 DNS Specification (modules/route53-zone, modules/route53_record)</b></summary>

        * **Hosted Zone Name** *(required)*: Domain name (e.g., `internal.retail.company.com`).
        * **Zone Type**: `Private` (associated with VPC) | `Public`
        * **DNS Records** *(optional)*: Record Name, Type (`A`, `CNAME`, `TXT`), Target Value, TTL (default 300).
        </details>

  - type: textarea
    id: route53_input
    attributes:
      label: "Route 53 DNS Configuration"
      description: "Specify Hosted Zone and DNS records. Leave blank if not requesting DNS."
      placeholder: |
        Hosted Zone: dev.platform.internal
        Zone Type: Private
        Record 1: api.dev.platform.internal -> CNAME -> alb.internal.dns -> TTL: 300
    validations:
      required: false

  # ============================================================================
  # 7. LOAD BALANCING
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## ⚖️ Load Balancing

        <details>
        <summary><b>ℹ️ Application/Network Load Balancer & Target Groups (modules/load_balancer)</b></summary>

        * **Load Balancer Name** *(required)*: ALB/NLB name (max 32 chars).
        * **Type** *(required)*: `application` (HTTP/HTTPS) | `network` (TCP/UDP)
        * **Internal** *(default: true)*: `true` (internal traffic) | `false` (internet-facing)
        * **Target Group Name** *(required)*: Target group identifier.
        * **Target Port & Protocol** *(required)*: E.g., Port `8080`, Protocol `HTTP`.
        * **Health Check Path** *(default: /health)*: Health check endpoint.
        </details>

  - type: textarea
    id: load_balancer_input
    attributes:
      label: "Load Balancer & Target Group Configuration"
      description: "Specify ALB/NLB and Target Group settings. Leave blank if not requesting."
      placeholder: |
        LB Name: app-internal-alb
        Type: application
        Internal: true
        Target Group Name: app-api-tg
        Target Port: 8080
        Target Protocol: HTTP
        Health Check Path: /healthz
    validations:
      required: false

  # ============================================================================
  # 8. CONTAINERS & CI/CD
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🚢 Containers & CI/CD Pipelines

        <details>
        <summary><b>ℹ️ ECR Container Registry Specification (modules/ecr)</b></summary>

        * **Repository Name** *(required)*: Name of the ECR repository (lowercase alphanumeric, hyphens).
        * **Image Tag Mutability** *(default: IMMUTABLE)*: `IMMUTABLE` | `MUTABLE`
        * **Scan on Push** *(default: true)*: Automated vulnerability scanning.
        </details>

  - type: textarea
    id: ecr_input
    attributes:
      label: "ECR Repository Configuration"
      description: "Specify repository name and mutability. Leave blank if not requesting ECR."
      placeholder: |
        Repository Name: auth-service
        Image Tag Mutability: IMMUTABLE
        Scan on Push: true
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ CI/CD Pipeline Suite Specification (modules/ci-cd)</b></summary>

        * **CodeBuild Project Name** *(optional)*: Name of the build project.
        * **Build Image / Compute** *(optional)*: E.g., `aws/codebuild/amazonlinux2-x86_64-standard:4.0`, `BUILD_GENERAL1_SMALL`.
        * **CodeDeploy App & Group** *(optional)*: Application and deployment group names.
        * **CodePipeline Name** *(optional)*: End-to-end pipeline name.
        * **CodeStar Connection** *(optional)*: Connection name for GitHub/Bitbucket authentication.
        </details>

  - type: textarea
    id: cicd_input
    attributes:
      label: "CI/CD Pipeline Configuration (CodeBuild, CodeDeploy, CodePipeline)"
      description: "Specify CI/CD build and pipeline parameters. Leave blank if not requesting."
      placeholder: |
        Pipeline Name: payment-service-pipeline
        Build Project Name: payment-service-build
        CodeStar Connection Name: github-enterprise-conn
        Source Repository: retail-platform/payment-service
        Source Branch: main
    validations:
      required: false

  # ============================================================================
  # 9. SECURITY, ENCRYPTION & IAM
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🔒 Security, Encryption & IAM

        <details>
        <summary><b>ℹ️ Security Group Specification (modules/security-group)</b></summary>

        * **Name** *(required)*: Security group identifier.
        * **Description** *(required)*: Purpose of the security group.
        * **Ingress Rules** *(required)*: Format: `Port | Protocol | CIDR or SG-ID`.
        * *Policy Restriction: 0.0.0.0/0 on port 22 (SSH) or 3389 (RDP) is strictly prohibited.*
        </details>

  - type: textarea
    id: security_group_input
    attributes:
      label: "Security Group Configuration"
      description: "Specify firewall inbound rules. Leave blank if not requesting."
      placeholder: |
        Name: backend-api-sg
        Description: Allows traffic from ALB to microservice port 8080
        Ingress 1: Port 8080 | TCP | 10.100.0.0/16
        Ingress 2: Port 443 | TCP | 10.100.0.0/16
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ KMS Key & Secrets Manager Specification (modules/kms, modules/secret-manager)</b></summary>

        * **KMS Key Description** *(required)*: Description for encryption key.
        * **KMS Deletion Window** *(default: 30)*: Days before deletion (7 to 30 days).
        * **Secrets Manager Secret Name** *(required)*: Path/name (e.g., `/dev/payments/stripe_api_key`).
        * **Secret Description** *(required)*: Purpose of the secret.
        </details>

  - type: textarea
    id: kms_secrets_input
    attributes:
      label: "KMS & Secrets Manager Configuration"
      description: "Specify encryption key or secret requirements. Leave blank if not requesting."
      placeholder: |
        KMS Key Description: Customer data encryption key for payment service
        KMS Deletion Window: 30
        Secret Name: /dev/payment-service/db-credentials
        Secret Description: Master DB credentials managed via Secrets Manager
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ IAM Roles, Custom Policies & Elevated Access (modules/iam-role, modules/policy, modules/readonly-plus-role)</b></summary>

        * **Custom IAM Role**: Role name, Trust Service (`ec2.amazonaws.com`, `lambda.amazonaws.com`), attached policy ARNs.
        * **Custom Policy**: Policy name, actions list (e.g. `s3:GetObject`), resources list (exact ARNs, no `*`).
        * **Elevated User Access (ReadOnlyPlus)**: User email (`firstname.lastname@nagarro.com`), role suffix (`EC2Admin`, `BillingView`), business justification (with ticket number).
        </details>

  - type: textarea
    id: iam_access_input
    attributes:
      label: "IAM Roles, Policies & Elevated Access Configuration"
      description: "Specify custom IAM roles or elevated user permissions. Leave blank if not requesting."
      placeholder: |
        Elevated Access Request:
        User Email: alice.smith@nagarro.com
        Role Suffix: EC2Admin
        Business Justification: Troubleshooting production deployment failure. Ticket: INC-98124.
    validations:
      required: false

  # ============================================================================
  # 10. OBSERVABILITY & NOTIFICATIONS
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 Observability & Notifications

        <details>
        <summary><b>ℹ️ CloudWatch Logs & Alarms (modules/cloud-watch)</b></summary>

        * **Log Group Name** *(required)*: E.g., `/aws/apps/payment-service`.
        * **Retention Period** *(default: 30)*: Days (7, 14, 30, 60, 90, 365).
        * **Alarm Metric** *(optional)*: Metric Name (`CPUUtilization`, `5XXError`), Threshold, Evaluation Periods.
        </details>

  - type: textarea
    id: cloudwatch_input
    attributes:
      label: "CloudWatch Logs & Alerts Configuration"
      description: "Specify log retention or alarm parameters. Leave blank if not requesting."
      placeholder: |
        Log Group Name: /aws/apps/payment-service
        Retention Days: 30
        Alarm Name: high-cpu-alert
        Metric: CPUUtilization > 80% for 2 periods of 5 minutes
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary><b>ℹ️ AWS Budget, Access Analyzer & SES (modules/aws-budget, access-analyzer, ses)</b></summary>

        * **AWS Budget**: Budget Name, Monthly Limit Amount (USD), Alert Threshold (e.g. 80%, 100%), Notification Email.
        * **Access Analyzer**: Analyzer Name, Type (`ACCOUNT` | `ORGANIZATION`).
        * **SES Email Identity**: Domain or verified email address for outgoing notification emails.
        </details>

  - type: textarea
    id: governance_tools_input
    attributes:
      label: "Budgets, Access Analyzer & SES Configuration"
      description: "Specify cost alerts, security analyzer, or SES identities. Leave blank if not requesting."
      placeholder: |
        Budget Name: payment-service-monthly-budget
        Monthly Limit USD: 500
        Alert Threshold: 80%
        Subscriber Email: tech.owner@nagarro.com
    validations:
      required: false

  # ============================================================================
  # 11. MANDATORY GOVERNANCE TAGS (global_tags)
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 📋 Mandatory Governance & Project Metadata
        All provisioned resources are tagged according to the **`modules/global_tags`** compliance policy. All fields in this section are mandatory.

  - type: input
    id: project_name
    attributes:
      label: "Project Name"
      description: "Project identifier used to tag and prefix all resources"
      placeholder: "e.g., payment-platform"
    validations:
      required: true

  - type: input
    id: project_owner
    attributes:
      label: "Project Owner"
      description: "Full name of the Project Manager or Business Lead"
      placeholder: "John Doe"
    validations:
      required: true

  - type: input
    id: technical_owner_email
    attributes:
      label: "Technical Owner Email"
      description: "Email address of the technical lead responsible for this infrastructure"
      placeholder: "tech.owner@nagarro.com"
    validations:
      required: true

  - type: input
    id: dm_email
    attributes:
      label: "Delivery Manager (DM) Email"
      description: "Email of the Delivery Manager for cost tracking and approvals"
      placeholder: "dm@nagarro.com"
    validations:
      required: true

  - type: input
    id: pceo_email
    attributes:
      label: "PCEO Email"
      description: "Email of the Project Chief Executive Officer / BU Governance"
      placeholder: "pceo@nagarro.com"
    validations:
      required: true

  - type: input
    id: bu_name
    attributes:
      label: "Business Unit (BU) Name"
      description: "e.g., Digital Commerce, Consumer, BFSI, Healthcare"
      placeholder: "Digital Commerce"
    validations:
      required: true

  - type: input
    id: expiry_date
    attributes:
      label: "Resource Expiry Date (YYYY-MM-DD)"
      description: "Mandatory expiry date. Maximum 1 month for Dev/QA environments"
      placeholder: "2026-12-31"
    validations:
      required: true

  - type: dropdown
    id: business_impact
    attributes:
      label: "Business Impact Level"
      description: "Potential business risk in case of downtime or security incident"
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
