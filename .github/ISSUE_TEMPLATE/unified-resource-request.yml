name: "Unified Infrastructure Request"
description: "Structured self-service request form with dropdowns and discrete fields for all cloud-governance modules."
title: "[Infra Request]: "
labels: ["provisioning", "stack"]

body:
  - type: markdown
    attributes:
      value: |
        # 🏛️ Unified Cloud Infrastructure Provisioning Form
        Request cloud infrastructure provisioned directly by the **`cloud-governance`** Terraform modules.
        
        ### 📌 Guidelines:
        * Select your target **Environment** and **AWS Region**.
        * Fill in the specific fields and dropdowns for the services you need.
        * For services you **do not need**, simply leave them as `Not Requested` or blank.
        * Complete all mandatory **Governance & Project Details** at the bottom.

  # ============================================================================
  # 1. TARGET ENVIRONMENT & REGION
  # ============================================================================
  - type: dropdown
    id: environment
    attributes:
      label: "Target Environment"
      description: "Select the deployment environment"
      options:
        - dev
        - qa
        - prod
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: "Target AWS Region"
      description: "Select primary AWS region for deployment"
      options:
        - ap-south-1
        - us-east-1
    validations:
      required: true

  # ============================================================================
  # 2. STORAGE & CDN
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🪣 1. Storage & Content Delivery
        <details>
        <summary><b>ℹ️ Click for S3 & CloudFront module specifications</b></summary>

        * **S3 Bucket (`modules/storage/s3`)**: Names must be globally unique, lowercase alphanumeric and hyphens (3–63 chars). Bucket will be automatically prefixed with `{project_name}-`.
        * **CloudFront CDN (`modules/cdn`)**: Global edge distribution. Requires S3 or ALB origin.
        </details>

  - type: input
    id: s3_bucket_name
    attributes:
      label: "S3 - Bucket Name Suffix"
      description: "Unique bucket name suffix (lowercase letters, numbers, hyphens). Leave blank if not requesting S3."
      placeholder: "e.g., app-assets-data"
    validations:
      required: false

  - type: dropdown
    id: s3_versioning
    attributes:
      label: "S3 - Versioning"
      description: "Keep multiple versions of an object in the bucket"
      options:
        - "Not Requested"
        - "Enabled"
        - "Disabled"
    validations:
      required: false

  - type: dropdown
    id: s3_encryption
    attributes:
      label: "S3 - Server-Side Encryption"
      description: "Select encryption standard"
      options:
        - "Not Requested"
        - "AES256"
        - "AWS-KMS"
    validations:
      required: false

  - type: input
    id: s3_noncurrent_expiration_days
    attributes:
      label: "S3 - Noncurrent Version Expiration (Days)"
      description: "Days before noncurrent versions are automatically deleted (default: 30)"
      placeholder: "30"
    validations:
      required: false

  - type: input
    id: cdn_origin_domain
    attributes:
      label: "CloudFront CDN - Origin Domain Name"
      description: "S3 bucket regional domain or ALB DNS name. Leave blank if not requesting CDN."
      placeholder: "e.g., payment-assets.s3.ap-south-1.amazonaws.com"
    validations:
      required: false

  - type: dropdown
    id: cdn_price_class
    attributes:
      label: "CloudFront CDN - Price Class"
      description: "Edge locations to deploy"
      options:
        - "Not Requested"
        - "PriceClass_100 (US, Canada, Europe)"
        - "PriceClass_200 (Most regions)"
        - "PriceClass_All (Global)"
    validations:
      required: false

  - type: dropdown
    id: cdn_viewer_protocol
    attributes:
      label: "CloudFront CDN - Viewer Protocol Policy"
      description: "HTTPS redirection behavior"
      options:
        - "Not Requested"
        - "redirect-to-https"
        - "https-only"
    validations:
      required: false

  # ============================================================================
  # 3. COMPUTE & SCHEDULING
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 💻 2. Compute & Scheduling
        <details>
        <summary><b>ℹ️ Click for EC2, Key Pair & Scheduler module specifications</b></summary>

        * **EC2 (`modules/compute/ec2`)**: Standardized compute instance with automated IAM log role and security group.
        * **SSH Key Pair (`modules/ssh-key-pair`)**: Imports OpenSSH public key.
        * **Scheduler (`modules/eventbridge_scheduler`)**: Automates periodic tasks (e.g. night instance shutdown).
        </details>

  - type: input
    id: ec2_instance_name
    attributes:
      label: "EC2 - Instance Name"
      description: "Name identifier for the instance. Leave blank if not requesting EC2."
      placeholder: "e.g., api-worker-server"
    validations:
      required: false

  - type: dropdown
    id: ec2_instance_type
    attributes:
      label: "EC2 - Instance Type"
      description: "FinOps-approved instance sizes"
      options:
        - "Not Requested"
        - "t3.micro (2 vCPU, 1 GB RAM - Dev/Test)"
        - "t3.small (2 vCPU, 2 GB RAM - Dev)"
        - "t3.medium (2 vCPU, 4 GB RAM - Staging)"
        - "t3.large (2 vCPU, 8 GB RAM - General)"
        - "m5.large (2 vCPU, 8 GB RAM - Production)"
    validations:
      required: false

  - type: dropdown
    id: ec2_ami_image
    attributes:
      label: "EC2 - Operating System / AMI"
      description: "Pre-approved hardened OS images"
      options:
        - "Not Requested"
        - "amazon-linux-2"
        - "ubuntu-22.04"
        - "redhat-9"
    validations:
      required: false

  - type: input
    id: ec2_root_volume_size
    attributes:
      label: "EC2 - Root Volume Size (GB)"
      description: "Size in GB (min: 20, max: 200)"
      placeholder: "30"
    validations:
      required: false

  - type: dropdown
    id: ec2_subnet_type
    attributes:
      label: "EC2 - Subnet Placement"
      description: "Deploy to private or public subnet"
      options:
        - "Not Requested"
        - "private (Recommended for applications)"
        - "public (Bastion / Ingress only)"
    validations:
      required: false

  - type: input
    id: ec2_ports_to_open
    attributes:
      label: "EC2 - Inbound Ports to Open"
      description: "Comma-separated list of ports (e.g. 80, 443, 8080)"
      placeholder: "80, 443"
    validations:
      required: false

  - type: dropdown
    id: ec2_access_intent
    attributes:
      label: "EC2 - Least Privilege IAM Access"
      description: "Minimal access policy intent automatically synthesized for companion resources"
      options:
        - "Not Requested"
        - "CloudWatch Logs Only (Default baseline)"
        - "S3 Read-Only + CloudWatch Logs"
        - "S3 Read-Write + CloudWatch Logs"
        - "RDS Connect + CloudWatch Logs"
        - "S3 Read-Write + RDS Connect + CloudWatch Logs"
    validations:
      required: false

  - type: input
    id: ssh_key_name
    attributes:
      label: "SSH Key Pair - Key Name"
      description: "Name for SSH key pair. Leave blank if not requesting SSH key."
      placeholder: "e.g., devops-admin-key"
    validations:
      required: false

  - type: textarea
    id: ssh_public_key
    attributes:
      label: "SSH Key Pair - Public Key String"
      description: "Paste your OpenSSH public key (starts with ssh-rsa or ssh-ed25519)"
      placeholder: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG... devops@nagarro.com"
    validations:
      required: false

  - type: input
    id: scheduler_name
    attributes:
      label: "EventBridge Scheduler - Name"
      description: "Schedule identifier. Leave blank if not requesting scheduler."
      placeholder: "e.g., nightly-stop-ec2"
    validations:
      required: false

  - type: input
    id: scheduler_expression
    attributes:
      label: "EventBridge Scheduler - Expression"
      description: "Cron or rate expression"
      placeholder: "e.g., cron(0 20 ? * MON-FRI *) or rate(1 day)"
    validations:
      required: false

  - type: input
    id: scheduler_target_arn
    attributes:
      label: "EventBridge Scheduler - Target ARN"
      description: "Target Lambda, ECS, or SSM Automation ARN to invoke"
      placeholder: "arn:aws:lambda:ap-south-1:123456789012:function:StopDevInstances"
    validations:
      required: false

  # ============================================================================
  # 4. DATABASES
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🗄️ 3. Databases
        <details>
        <summary><b>ℹ️ Click for RDS Instance & Parameter Group specifications</b></summary>

        * **RDS Instance (`modules/rds/instance`)**: Managed relational database with automated backups and encryption.
        * **RDS Parameter Group (`modules/rds/parameter_group`)**: Custom database configuration parameters.
        </details>

  - type: input
    id: rds_identifier
    attributes:
      label: "RDS - Database Identifier"
      description: "Unique name for the database instance. Leave blank if not requesting RDS."
      placeholder: "e.g., primary-orders-db"
    validations:
      required: false

  - type: dropdown
    id: rds_engine
    attributes:
      label: "RDS - Database Engine"
      description: "Select supported database engine"
      options:
        - "Not Requested"
        - "postgres"
        - "mysql"
        - "mariadb"
    validations:
      required: false

  - type: input
    id: rds_engine_version
    attributes:
      label: "RDS - Engine Version"
      description: "Major.minor version (e.g. 15.4 for PostgreSQL, 8.0 for MySQL)"
      placeholder: "15.4"
    validations:
      required: false

  - type: dropdown
    id: rds_instance_class
    attributes:
      label: "RDS - Instance Class"
      description: "Select approved database compute tier"
      options:
        - "Not Requested"
        - "db.t4g.micro (2 vCPU, 1 GB RAM - Dev/Test)"
        - "db.t4g.small (2 vCPU, 2 GB RAM - Dev/Staging)"
        - "db.t4g.medium (2 vCPU, 4 GB RAM - Medium Workloads)"
        - "db.r6g.large (2 vCPU, 16 GB RAM - Production High Memory)"
    validations:
      required: false

  - type: input
    id: rds_allocated_storage
    attributes:
      label: "RDS - Allocated Storage (GB)"
      description: "Storage size in GB (min: 20, max: 500)"
      placeholder: "20"
    validations:
      required: false

  - type: dropdown
    id: rds_multi_az
    attributes:
      label: "RDS - High Availability (Multi-AZ)"
      description: "Deploy secondary standby in another AZ"
      options:
        - "Not Requested"
        - "false (Single AZ - Dev/Test cost optimization)"
        - "true (Multi-AZ - Recommended for Production)"
    validations:
      required: false

  - type: input
    id: rds_database_name
    attributes:
      label: "RDS - Initial Database Name"
      description: "Name of default database schema to create (alphanumeric)"
      placeholder: "orders_db"
    validations:
      required: false

  - type: input
    id: rds_pg_name
    attributes:
      label: "RDS Parameter Group - Name"
      description: "Name for parameter group. Leave blank if using default."
      placeholder: "e.g., custom-pg15-config"
    validations:
      required: false

  - type: dropdown
    id: rds_pg_family
    attributes:
      label: "RDS Parameter Group - Engine Family"
      description: "Target engine family"
      options:
        - "Not Requested"
        - "postgres15"
        - "postgres14"
        - "mysql8.0"
        - "mariadb10.6"
    validations:
      required: false

  # ============================================================================
  # 5. NETWORKING & DNS
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🌐 4. Networking & DNS
        <details>
        <summary><b>ℹ️ Click for VPC, Subnets, EIP, Flow Logs & Route53 specifications</b></summary>

        * **VPC (`modules/vpc`)**: Isolated virtual network.
        * **Subnets (`modules/subnets`)**: Public and private subnet tiers across multiple availability zones.
        * **Route53 (`modules/route53-zone`, `modules/route53_record`)**: DNS hosted zone and records.
        </details>

  - type: input
    id: vpc_name
    attributes:
      label: "VPC - Network Name"
      description: "Identifier for new VPC. Leave blank if using existing VPC."
      placeholder: "e.g., payment-core-vpc"
    validations:
      required: false

  - type: input
    id: vpc_cidr_block
    attributes:
      label: "VPC - CIDR Block"
      description: "Primary IPv4 network range (e.g. 10.100.0.0/16)"
      placeholder: "10.100.0.0/16"
    validations:
      required: false

  - type: input
    id: public_subnet_cidrs
    attributes:
      label: "Subnets - Public Subnet CIDRs"
      description: "Comma-separated CIDRs for public tier"
      placeholder: "10.100.1.0/24, 10.100.2.0/24"
    validations:
      required: false

  - type: input
    id: private_subnet_cidrs
    attributes:
      label: "Subnets - Private Subnet CIDRs"
      description: "Comma-separated CIDRs for private tier"
      placeholder: "10.100.11.0/24, 10.100.12.0/24"
    validations:
      required: false

  - type: input
    id: eip_name
    attributes:
      label: "Elastic IP (EIP) - Name"
      description: "Name for Elastic IP. Leave blank if not requesting EIP."
      placeholder: "e.g., nat-gateway-eip"
    validations:
      required: false

  - type: dropdown
    id: vpc_flow_logs_traffic
    attributes:
      label: "VPC Flow Logs - Traffic Type"
      description: "Types of traffic to capture"
      options:
        - "Not Requested"
        - "ALL"
        - "ACCEPT"
        - "REJECT"
    validations:
      required: false

  - type: input
    id: route53_zone_name
    attributes:
      label: "Route 53 - Hosted Zone Domain"
      description: "Domain name for DNS zone. Leave blank if not requesting DNS."
      placeholder: "e.g., dev.platform.internal"
    validations:
      required: false

  - type: dropdown
    id: route53_zone_type
    attributes:
      label: "Route 53 - Zone Type"
      description: "Select private or public zone"
      options:
        - "Not Requested"
        - "Private (VPC Associated)"
        - "Public"
    validations:
      required: false

  - type: input
    id: route53_record_name
    attributes:
      label: "Route 53 - Record Name"
      description: "Hostname for record"
      placeholder: "e.g., api.dev.platform.internal"
    validations:
      required: false

  - type: dropdown
    id: route53_record_type
    attributes:
      label: "Route 53 - Record Type"
      description: "DNS record type"
      options:
        - "Not Requested"
        - "A"
        - "CNAME"
        - "TXT"
    validations:
      required: false

  - type: input
    id: route53_record_target
    attributes:
      label: "Route 53 - Record Target"
      description: "Target IP address or canonical hostname"
      placeholder: "e.g., internal-alb-12345.ap-south-1.elb.amazonaws.com"
    validations:
      required: false

  # ============================================================================
  # 6. LOAD BALANCING
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## ⚖️ 5. Load Balancing
        <details>
        <summary><b>ℹ️ Click for ALB/NLB & Target Group module specifications</b></summary>

        * **Load Balancer Core (`modules/load_balancer/load_balancer_core`)**: Highly available load balancer across availability zones.
        * **Target Group (`modules/load_balancer/target_group`)**: Directs traffic to EC2 or IP targets with health checks.
        </details>

  - type: input
    id: alb_name
    attributes:
      label: "Load Balancer - Name"
      description: "Load Balancer identifier (max 32 chars). Leave blank if not requesting ALB."
      placeholder: "e.g., app-internal-alb"
    validations:
      required: false

  - type: dropdown
    id: alb_type
    attributes:
      label: "Load Balancer - Type"
      description: "Application (HTTP/HTTPS) or Network (TCP/UDP)"
      options:
        - "Not Requested"
        - "application"
        - "network"
    validations:
      required: false

  - type: dropdown
    id: alb_scheme
    attributes:
      label: "Load Balancer - Scheme"
      description: "Internal (private VPC) or Internet-facing"
      options:
        - "Not Requested"
        - "internal (Private - Default)"
        - "internet-facing (Public)"
    validations:
      required: false

  - type: input
    id: tg_name
    attributes:
      label: "Target Group - Name"
      description: "Name for Target Group. Leave blank if not requesting."
      placeholder: "e.g., app-api-tg"
    validations:
      required: false

  - type: input
    id: tg_port
    attributes:
      label: "Target Group - Port"
      description: "Backend destination port (e.g. 80, 443, 8080)"
      placeholder: "8080"
    validations:
      required: false

  - type: dropdown
    id: tg_protocol
    attributes:
      label: "Target Group - Protocol"
      description: "Backend protocol"
      options:
        - "Not Requested"
        - "HTTP"
        - "HTTPS"
        - "TCP"
    validations:
      required: false

  - type: input
    id: tg_health_check_path
    attributes:
      label: "Target Group - Health Check Path"
      description: "Destination URL path for health check requests"
      placeholder: "/healthz"
    validations:
      required: false

  # ============================================================================
  # 7. CONTAINERS & CI/CD
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🚢 6. Containers & CI/CD
        <details>
        <summary><b>ℹ️ Click for ECR & CI/CD pipeline module specifications</b></summary>

        * **ECR (`modules/ecr`)**: Secure Docker container image registry with vulnerability scanning.
        * **CI/CD (`modules/ci-cd`)**: AWS native deployment pipeline suite (CodeBuild, CodeDeploy, CodePipeline).
        </details>

  - type: input
    id: ecr_repository_name
    attributes:
      label: "ECR - Repository Name"
      description: "Repository name (lowercase alphanumeric and hyphens). Leave blank if not requesting ECR."
      placeholder: "e.g., auth-microservice"
    validations:
      required: false

  - type: dropdown
    id: ecr_tag_mutability
    attributes:
      label: "ECR - Image Tag Mutability"
      description: "Prevent overriding existing container image tags"
      options:
        - "Not Requested"
        - "IMMUTABLE (Recommended)"
        - "MUTABLE"
    validations:
      required: false

  - type: dropdown
    id: ecr_scan_on_push
    attributes:
      label: "ECR - Scan on Push"
      description: "Automated vulnerability scanning on image push"
      options:
        - "Not Requested"
        - "Enabled (true - Recommended)"
        - "Disabled (false)"
    validations:
      required: false

  - type: input
    id: cicd_pipeline_name
    attributes:
      label: "CI/CD - Pipeline Name"
      description: "Name of the deployment pipeline. Leave blank if not requesting CI/CD."
      placeholder: "e.g., payment-service-pipeline"
    validations:
      required: false

  - type: input
    id: cicd_source_repo
    attributes:
      label: "CI/CD - Source Repository"
      description: "GitHub repository path (org/repo)"
      placeholder: "retail-platform/payment-service"
    validations:
      required: false

  - type: input
    id: cicd_source_branch
    attributes:
      label: "CI/CD - Source Branch"
      description: "Target branch that triggers pipeline"
      placeholder: "develop"
    validations:
      required: false

  - type: dropdown
    id: cicd_build_compute
    attributes:
      label: "CI/CD - CodeBuild Compute Size"
      description: "Build environment compute tier"
      options:
        - "Not Requested"
        - "BUILD_GENERAL1_SMALL (3 GB RAM, 2 vCPU)"
        - "BUILD_GENERAL1_MEDIUM (7 GB RAM, 4 vCPU)"
        - "BUILD_GENERAL1_LARGE (15 GB RAM, 8 vCPU)"
    validations:
      required: false

  # ============================================================================
  # 8. SECURITY, ENCRYPTION & IAM
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 🔒 7. Security, Encryption & IAM
        <details>
        <summary><b>ℹ️ Click for Security Group, KMS, Secrets Manager & Role specifications</b></summary>

        * **Security Group (`modules/security-group`)**: Stateful network firewall. 0.0.0.0/0 on SSH/RDP is strictly prohibited.
        * **KMS (`modules/kms`)**: Customer managed encryption key with automated rotation.
        * **Secrets Manager (`modules/secret-manager`)**: Encrypted secret storage for passwords and API tokens.
        * **ReadOnlyPlus Role (`modules/readonly-plus-role`)**: Time-bound elevated role assignment for troubleshooting.
        </details>

  - type: input
    id: sg_name
    attributes:
      label: "Security Group - Name"
      description: "Security group identifier. Leave blank if not requesting."
      placeholder: "e.g., backend-microservice-sg"
    validations:
      required: false

  - type: input
    id: sg_description
    attributes:
      label: "Security Group - Description"
      description: "Business purpose of the security group"
      placeholder: "Allows internal HTTP traffic from ALB to microservice port 8080"
    validations:
      required: false

  - type: input
    id: sg_ingress_port
    attributes:
      label: "Security Group - Ingress Port"
      description: "Inbound port to allow (e.g. 80, 443, 8080)"
      placeholder: "8080"
    validations:
      required: false

  - type: dropdown
    id: sg_ingress_protocol
    attributes:
      label: "Security Group - Ingress Protocol"
      description: "Protocol for rule"
      options:
        - "Not Requested"
        - "tcp"
        - "udp"
        - "-1 (all protocols)"
    validations:
      required: false

  - type: input
    id: sg_ingress_cidr
    attributes:
      label: "Security Group - Ingress CIDR / SG ID"
      description: "Allowed source IP range or Security Group ID"
      placeholder: "10.100.0.0/16"
    validations:
      required: false

  - type: input
    id: kms_description
    attributes:
      label: "KMS Key - Description"
      description: "Purpose of the KMS key. Leave blank if not requesting KMS."
      placeholder: "e.g., Encryption key for payment platform customer data"
    validations:
      required: false

  - type: dropdown
    id: kms_deletion_window
    attributes:
      label: "KMS Key - Deletion Window (Days)"
      description: "Waiting period before key deletion"
      options:
        - "Not Requested"
        - "30 days (Recommended)"
        - "14 days"
        - "7 days"
    validations:
      required: false

  - type: input
    id: secret_name
    attributes:
      label: "Secrets Manager - Secret Name"
      description: "Hierarchical path for secret. Leave blank if not requesting."
      placeholder: "e.g., /dev/payments/database_credentials"
    validations:
      required: false

  - type: input
    id: secret_description
    attributes:
      label: "Secrets Manager - Description"
      description: "Description of the secret content"
      placeholder: "Master database connection credentials"
    validations:
      required: false

  - type: input
    id: elevated_user_email
    attributes:
      label: "Elevated IAM Access - User Email"
      description: "Email address of user requesting elevated role. Leave blank if not requesting access."
      placeholder: "firstname.lastname@nagarro.com"
    validations:
      required: false

  - type: dropdown
    id: elevated_role_suffix
    attributes:
      label: "Elevated IAM Access - Role"
      description: "Select pre-defined elevated role"
      options:
        - "Not Requested"
        - "ReadOnlyPlus-EC2Admin"
        - "ReadOnlyPlus-BillingView"
        - "ReadOnlyPlus-DevOpsLead"
    validations:
      required: false

  - type: input
    id: elevated_access_justification
    attributes:
      label: "Elevated IAM Access - Business Justification"
      description: "Ticket number and business justification for temporary elevated access"
      placeholder: "Troubleshooting prod incident INC-90124. Access needed for 14 days."
    validations:
      required: false

  # ============================================================================
  # 9. OBSERVABILITY & GOVERNANCE TOOLS
  # ============================================================================
  - type: markdown
    attributes:
      value: |
        ---
        ## 📊 8. Observability & Cost Governance
        <details>
        <summary><b>ℹ️ Click for CloudWatch, Budget & Security Analyzer specifications</b></summary>

        * **CloudWatch Logs (`modules/cloud-watch/logs`)**: Centralized application log storage and retention.
        * **AWS Budget (`modules/aws-budget`)**: Real-time spend tracking and automated email alerts.
        * **Access Analyzer (`modules/access-analyzer`)**: Detects external public resource sharing.
        </details>

  - type: input
    id: log_group_name
    attributes:
      label: "CloudWatch Logs - Log Group Name"
      description: "Path for log group. Leave blank if not requesting log group."
      placeholder: "e.g., /aws/apps/payment-platform"
    validations:
      required: false

  - type: dropdown
    id: log_retention_days
    attributes:
      label: "CloudWatch Logs - Retention Period"
      description: "Retention days before logs are deleted"
      options:
        - "Not Requested"
        - "30 days (Standard Dev)"
        - "14 days"
        - "60 days"
        - "90 days (Production standard)"
        - "365 days"
    validations:
      required: false

  - type: input
    id: budget_name
    attributes:
      label: "AWS Budget - Budget Name"
      description: "Name for monthly cost budget. Leave blank if not requesting budget."
      placeholder: "e.g., payment-service-monthly-budget"
    validations:
      required: false

  - type: input
    id: budget_limit_usd
    attributes:
      label: "AWS Budget - Monthly Limit (USD)"
      description: "Monthly budget ceiling in USD"
      placeholder: "500"
    validations:
      required: false

  - type: dropdown
    id: access_analyzer_type
    attributes:
      label: "IAM Access Analyzer - Analyzer Scope"
      description: "Scope of the external access analyzer"
      options:
        - "Not Requested"
        - "ACCOUNT"
        - "ORGANIZATION"
    validations:
      required: false

  - type: input
    id: ses_email_identity
    attributes:
      label: "SES - Verified Email Identity"
      description: "Sender email address to verify in Amazon SES. Leave blank if not requesting."
      placeholder: "noreply@nagarro.com"
    validations:
      required: false

  # ============================================================================
